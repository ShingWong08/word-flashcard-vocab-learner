[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "word_flashcard_vocab_learner"
authors = [
    {name = "Shing8981", email = "shingwong088@gmail.com"},
    {name = "Chaus9587", email = "chausandchaus@gmail.com"},
    {name = "KristyChong"},
    {name = "AndyTLY"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

# version 和 description 由 flit 從 __init__.py 的 __version__ 和 docstring 讀取
dynamic = ["version", "description"]

# 程式碼使用了 `str | None` 寫法，最低需要 Python 3.10
requires-python = ">=3.10"
keywords = ["flashcard", "vocabulary", "english-learning", "education", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
]

dependencies = [
    "requests",        # connectFreeDictionaryAPI、connectGenAIRequest
    "openai",          # connectGenAI
    "python-dotenv",   # 從 .env 讀取 API key
]

[project.optional-dependencies]
# 語音功能（ElevenLabs 語音轉文字 / 文字轉語音）
# 錄音需要 PortAudio 系統庫；自動播放音頻需要安裝 ffmpeg（ffplay）
speech = [
    "elevenlabs",
    "sounddevice",
    "soundfile",
    "pyperclip",
]
# 從 PDF 和 Word（.docx）文件導入生字
documents = [
    "pypdf",
    "python-docx",
]
# 從相片 / 掃描文件導入生字（OCR）；需要另外安裝 Tesseract OCR 程式
ocr = [
    "pytesseract",
    "Pillow",
    "pypdfium2",
]
dev = [
    "pytest",
]

[project.scripts]
word-flashcard = "word_flashcard_vocab_learner:main"

[project.urls]
Home = "https://github.com/ShingWong08/word-flashcard-vocab-learner"
Repository = "https://github.com/ShingWong08/word-flashcard-vocab-learner"
Issues = "https://github.com/ShingWong08/word-flashcard-vocab-learner/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# 代碼格式：Black（PEP 8），每行最多 88 個字元，保持 Python 3.10 語法
[tool.black]
line-length = 88
target-version = ["py310"]
